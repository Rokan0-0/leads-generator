<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Glowing border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="8"/>
  
  <!-- Pulse Line Graphic -->
  <path d="M 96 270 L 170 270 L 205 160 L 255 360 L 300 220 L 335 290 L 375 270 L 416 270" 
        fill="none" 
        stroke="url(#emerald)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- WhatsApp / Communication Dot -->
  <circle cx="255" cy="360" r="16" fill="#34d399"/>
  <circle cx="205" cy="160" r="16" fill="#38bdf8"/>
</svg>
